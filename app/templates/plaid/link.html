{% extends "layout.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-body text-center p-5">
                    <h1 class="h3 mb-4">Connect Your Bank Account</h1>
                    <p class="lead mb-4">Link your accounts securely with Plaid to track your finances</p>

                    <!-- Hidden form to submit public token -->
                    <form id="public-token-form" method="POST" action="{{ url_for('plaid.plaid_success') }}">
                        <input type="hidden" name="public_token" id="public_token">
                        <button type="button" id="plaid-link-button" class="btn btn-primary btn-lg px-4 py-2">
                            Connect Your Bank
                        </button>
                    </form>

                    <p class="mt-4 text-muted">
                        <small>Your credentials are securely handled by Plaid and never stored on our servers.</small>
                    </p>
                </div>
            </div>

            <div class="mt-4 text-center">
                <a href="{{ url_for('financial.dashboard') }}" class="text-decoration-none">
                    &larr; Back to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>

<!-- Load Plaid Link library -->
<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Get link token from the server
        const linkToken = "{{ link_token }}";

        // Initialize Plaid Link
        const linkHandler = Plaid.create({
            token: linkToken,
            onSuccess: function (public_token, metadata) {
                // After user successfully connects with their bank account
                console.log('Public token obtained:', public_token);

                // Add public token to form and submit
                document.getElementById('public_token').value = public_token;
                document.getElementById('public-token-form').submit();
            },
            onExit: function (err, metadata) {
                // User closed Plaid Link without completing
                if (err != null) {
                    console.error('Plaid Link error:', err);
                    alert('There was an error connecting to your bank. Please try again.');
                }
                // Redirect back to dashboard if user exits
                window.location.href = "{{ url_for('financial.dashboard') }}";
            },
            onLoad: function () {
                // Link is ready to use
                console.log('Plaid Link loaded');
            },
            receivedRedirectUri: null,
        });

        // Attach event listener to button
        document.getElementById('plaid-link-button').addEventListener('click', function () {
            linkHandler.open();
        });
    });
</script>
{% endblock %}
